<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CCT BUZZ Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="home.css"></head>
<body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">C</span><span><strong>CCT</strong> BUZZ</span></a><nav class="desktop-nav"><a id="quizFacultyLink" href="#">Faculty</a><a href="index.html#faculties">Faculties</a></nav><button class="menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false"></button><div class="mobile-menu" id="mobileMenu"><div class="mobile-menu-inner"><div class="menu-head"><span>Quiz navigation</span><button id="menuClose">×</button></div><a id="quizFacultyMobile" href="#">Back to faculty</a><a href="index.html#faculties">All faculties</a></div></div></header>
<main class="quiz-page"><a class="back-link" id="quizBack" href="#">← Back to faculty</a><div class="quiz-top"><div><p class="eyebrow" id="quizEyebrow">CCT BUZZ · QUIZ</p><h1 id="quizTitle">Quiz</h1><p id="quizSub">Choose a level and test yourself.</p></div><div class="score-board"><span>GAME POINTS</span><strong id="score">0</strong><small>saved on this device</small></div></div>
<div class="level-picker" id="levelPicker"><button data-level="beginner"><span>LEVEL 01</span><b>Starter</b><small>5 × 10 pts</small></button><button data-level="intermediate"><span>LEVEL 02</span><b>Builder</b><small>5 × 20 pts</small></button><button data-level="advanced"><span>LEVEL 03</span><b>Challenger</b><small>5 × 30 pts</small></button></div>
<section class="quiz-box" id="quizBox" hidden><div class="quiz-meta"><span id="questionCount">Question 1 / 5</span><span id="levelName">STARTER</span></div><div class="progress"><i id="progressBar"></i></div><h2 id="questionText"></h2><div class="answers" id="answers"></div><div class="quiz-footer"><span id="feedback"></span><button class="button button-primary" id="nextQuestion" disabled>Lock answer →</button></div></section>
<div class="quiz-result-modal" id="quizResultModal" aria-hidden="true"><div class="quiz-result-backdrop" id="quizResultBackdrop"></div><section class="quiz-result-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><button class="quiz-result-close" id="quizResultClose" aria-label="Close result">×</button><div class="game-trophy"><span>✦</span></div><p class="eyebrow">LEVEL COMPLETE</p><h2 id="resultTitle">Nice work.</h2><div class="result-points"><strong id="earned">0</strong><span>POINTS EARNED</span></div><p id="resultText"></p><div class="result-actions"><button class="button button-primary" id="again">Play again</button><a class="text-link" id="resultFaculty" href="#">Back to faculty</a></div></section></div></main><script src="home.js"></script></body></html>
